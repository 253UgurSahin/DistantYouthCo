services:
  studio:
    build: .
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # optioneel: ANTHROPIC_API_KEY, of zet de key in de app bij Instellingen
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - studio-storage:/var/www/html/storage

volumes:
  studio-storage:
